<html lang="id">
<head>
<meta charset="utf-8">

<title>Jeopardy Nusantara</title>

<style>
:root{
  --studio:#e8ebf6;--panel:#fff;--text:#101432;--muted:#5a6080;--line:#c9cfe6;
  --board:#07138f;--cell:#1330c9;--cell-hi:#1c3fe6;--cell-used:#0a1678;--gold:#f7c326;
  --ok:#1f9d55;--bad:#d6313a;
  --p0:#e5484d;--p1:#12a594;--p2:#8e4ec6;--p3:#f76b15;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--studio:#050826;--panel:#0d1340;--text:#eef0ff;--muted:#a3a9d6;--line:#26306e}}
:root[data-theme="dark"]{--studio:#050826;--panel:#0d1340;--text:#eef0ff;--muted:#a3a9d6;--line:#26306e}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--studio);color:var(--text);font-family:Archivo,"Helvetica Neue",Arial,sans-serif;font-size:16px;line-height:1.45}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.hidden{display:none!important}
.wrap{max-width:760px;margin:0 auto;padding:22px 18px 40px}
.logo{font-family:"Alfa Slab One",Georgia,serif;font-size:clamp(34px,8vw,64px);line-height:.95;color:var(--gold);background:var(--board);padding:20px 22px 24px;margin:0 0 14px;text-shadow:3px 3px 0 #000a;border-radius:6px}
.logo small{display:block;font-family:Archivo,sans-serif;font-weight:600;font-size:15px;color:#fff;text-shadow:none;margin-top:10px}
.sect{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:18px;margin-top:14px}
.sect h2{margin:0 0 10px;font-size:18px}
.hint{color:var(--muted);font-size:14px;margin:8px 0 0}
.big{display:block;width:100%;margin-top:14px;padding:16px;border:0;border-radius:6px;background:var(--gold);color:#1a1300;font-weight:800;font-size:19px}
.big.alt{background:var(--board);color:var(--gold)}
.big:disabled{opacity:.4}
.field{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--text);font:inherit;font-size:17px}
.err{color:var(--bad);font-weight:600;margin-top:10px}
.count{display:flex;gap:8px;flex-wrap:wrap}
.count button{flex:1;padding:12px;border:2px solid var(--line);background:transparent;color:var(--text);border-radius:5px;font-weight:800}
.count button[aria-pressed="true"]{background:var(--board);border-color:var(--board);color:var(--gold)}
.roster{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.pill{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--panel);border:1px solid var(--line);border-left:7px solid var(--pc,var(--muted));border-radius:5px;font-weight:700}
.dot{width:12px;height:12px;border-radius:50%;background:var(--pc,var(--muted))}

/* game shell */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;background:var(--board);color:#fff}
.top .round{font-family:"Alfa Slab One",Georgia,serif;color:var(--gold);font-size:18px}
.top .turn{font-size:13px;opacity:.9}
.top button{background:transparent;border:1px solid #ffffff55;color:#fff;border-radius:4px;padding:6px 9px;font-size:13px}
.boardwrap{overflow-x:auto;padding:8px;background:var(--board)}
.board{display:grid;gap:5px;min-width:560px}
.board.ro{min-width:0}
.cat{background:var(--cell);color:#fff;font-weight:800;text-align:center;display:flex;align-items:center;justify-content:center;padding:8px 4px;min-height:52px;font-size:clamp(11px,1.5vw,17px);line-height:1.12;border-bottom:4px solid #000}
.cell{background:var(--cell);border:0;color:var(--gold);font-family:"Alfa Slab One",Georgia,serif;font-size:clamp(18px,3vw,38px);min-height:54px;text-shadow:2px 2px 0 #000}
.cell:hover:not(:disabled){background:var(--cell-hi)}
.cell:disabled{background:var(--cell-used);color:transparent;text-shadow:none;cursor:default}
.cell.ro{cursor:default;font-size:clamp(11px,2vw,20px);min-height:34px}
.scores{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:7px;padding:9px;background:#000}
.plate{background:#0b1466;color:#fff;border-radius:4px;padding:7px 11px;border-top:5px solid var(--pc);position:relative}
.plate.ctrl{box-shadow:inset 0 0 0 2px var(--gold)}
.plate.me{outline:2px solid #fff}
.plate .nm{font-weight:800;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plate .sc{font-family:"Alfa Slab One",Georgia,serif;font-size:23px}
.plate .sc.neg{color:#ff8a8f}
.plate .buz{position:absolute;top:7px;right:9px;font-size:11px;color:var(--gold)}

/* clue overlay */
.clue{position:fixed;inset:0;background:var(--board);color:#fff;display:flex;flex-direction:column;z-index:10;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.chead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:13px 18px 0;font-weight:800}
.chead .v{font-family:"Alfa Slab One",Georgia,serif;color:var(--gold);font-size:24px}
.ctext{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:16px 20px;font-size:clamp(22px,3.8vw,46px);font-weight:800;line-height:1.2;text-shadow:2px 2px 0 #000a;overflow:auto}
.ctext .inner{max-width:26ch}
.dd{font-family:"Alfa Slab One",Georgia,serif;color:var(--gold);font-size:clamp(40px,9vw,96px);line-height:1;text-shadow:4px 4px 0 #000}
.timer{height:9px;background:#ffffff22;margin:0 18px}
.timer i{display:block;height:100%;background:var(--gold);width:100%;transition:width .1s linear}
.timer.urgent i{background:var(--bad)}
.status{text-align:center;font-weight:800;font-size:18px;padding:10px 16px 0;min-height:34px}
.act{padding:12px 16px 20px}
.buzzbig{display:block;width:100%;max-width:520px;margin:6px auto;border:0;border-radius:16px;padding:44px 16px;background:var(--pc,var(--gold));color:#fff;font-weight:800;font-size:30px;box-shadow:0 8px 0 #0006;touch-action:manipulation}
.buzzbig:active{transform:translateY(5px);box-shadow:0 3px 0 #0006}
.buzzbig:disabled{opacity:.3;box-shadow:none}
.ansrow{display:flex;gap:10px;max-width:600px;margin:0 auto}
.ansrow input{flex:1;min-width:0;padding:15px;font:inherit;font-size:20px;border:3px solid var(--pc,var(--gold));border-radius:8px;background:#fff;color:#101432}
.btn{border:0;border-radius:8px;padding:14px 20px;font-weight:800;font-size:17px;background:var(--gold);color:#1a1300}
.btn.ghost{background:transparent;color:#fff;border:1px solid #ffffff88;font-weight:600;font-size:14px;padding:10px 14px}
.btnrow{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center}
.verdict{font-family:"Alfa Slab One",Georgia,serif;font-size:clamp(30px,5.5vw,56px);line-height:1}
.verdict.ok{color:#6ff2a5}.verdict.bad{color:#ff8a8f}
.typed{font-size:17px;opacity:.9;margin-top:8px}
.answer{font-size:clamp(20px,3.2vw,34px);color:var(--gold);margin-top:10px}
.flag{background:none;border:0;color:#c7cdf7;text-decoration:underline;font-size:13px;padding:6px}
.rank{display:flex;justify-content:space-between;align-items:center;padding:13px 15px;background:var(--panel);border:1px solid var(--line);border-left:8px solid var(--pc);border-radius:4px;margin-top:9px;font-weight:800;font-size:19px}
.rank .slab{font-family:"Alfa Slab One",Georgia,serif;font-size:24px}
.wait{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;text-align:center;gap:14px}
.spin{width:34px;height:34px;border:4px solid #ffffff44;border-top-color:var(--gold);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#000;color:#fff;padding:10px 16px;border-radius:6px;z-index:50;font-size:14px;max-width:90vw;text-align:center}
.badge{display:inline-block;background:#ffffff22;border-radius:20px;padding:3px 10px;font-size:12px;margin-left:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script>
/* ============ matcher ============ */
var FILLERS = ["apa itu ", "siapa itu ", "siapakah ", "apakah ", "siapa ", "apa ", "the ", "adalah ", "yaitu "];
function normAns(s) {
  s = String(s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  s = s.replace(/[-_\/]/g, " ").replace(/[^a-z0-9 ]/g, "").replace(/\s+/g, " ").trim();
  var changed = true;
  while (changed) {
    changed = false;
    for (var i = 0; i < FILLERS.length; i++) {
      if (s.indexOf(FILLERS[i]) === 0 && s.length > FILLERS[i].length) { s = s.slice(FILLERS[i].length); changed = true; }
    }
  }
  return s;
}
function lev(a, b) {
  if (a === b) return 0;
  var m = a.length, n = b.length;
  if (!m) return n; if (!n) return m;
  var prev = [], cur = [];
  for (var j = 0; j <= n; j++) prev[j] = j;
  for (var i = 1; i <= m; i++) {
    cur = [i];
    for (var j2 = 1; j2 <= n; j2++) {
      var c = a[i - 1] === b[j2 - 1] ? 0 : 1;
      cur[j2] = Math.min(prev[j2] + 1, cur[j2 - 1] + 1, prev[j2 - 1] + c);
    }
    prev = cur;
  }
  return prev[n];
}
// Toleransi typo: angka harus persis; <=4 huruf persis; 5-9 huruf boleh 1 salah; >=10 huruf boleh 2 salah
function tolFor(key) {
  if (/^\d+$/.test(key)) return 0;
  if (key.length <= 4) return 0;
  if (key.length <= 9) return 1;
  return 2;
}
function checkAnswer(input, answers, strict) {
  var u = normAns(input);
  if (!u) return false;
  var uc = u.replace(/ /g, ""), uw = u.split(" ");
  for (var k = 0; k < answers.length; k++) {
    var a = normAns(answers[k]);
    if (!a) continue;
    var ac = a.replace(/ /g, ""), t = strict ? 0 : tolFor(ac);
    if (lev(uc, ac) <= t) return true;
    // Jawaban benar yang diapit kata tambahan, misal "sungai amazon" untuk "amazon".
    // Maksimal 2 kata ekstra supaya nggak bisa ngetik banyak tebakan sekaligus.
    var aw = a.split(" ");
    if (uw.length > aw.length && uw.length <= aw.length + 2) {
      for (var i = 0; i + aw.length <= uw.length; i++) {
        if (lev(uw.slice(i, i + aw.length).join(""), ac) <= t) return true;
      }
    }
  }
  return false;
}
if (typeof module !== "undefined") module.exports = { normAns: normAns, checkAnswer: checkAnswer };

</script>

<script>
(function(){
"use strict";
var PCOL=["var(--p0)","var(--p1)","var(--p2)","var(--p3)"];
var CATS=Q.map(function(c){return {id:c.id,name:c.name,strict:!!c.strict,items:c.q.map(function(x,i){return {id:c.id+":"+i,d:x[0],q:x[1],a:x[2].split("|")}})}});
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function fmt(n){n=n||0;return (n<0?"-":"")+Math.abs(n).toLocaleString("id-ID")}
function $(id){return document.getElementById(id)}
var root=$("root");

/* ============ audio ============ */
var AC=null;
function beep(f,d,type){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();var o=AC.createOscillator(),g=AC.createGain();o.type=type||"square";o.frequency.value=f;o.connect(g);g.connect(AC.destination);g.gain.setValueAtTime(0.07,AC.currentTime);g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+d);o.start();o.stop(AC.currentTime+d)}catch(e){}}

/* ============ capability bootstrap ============ */
var ME={peer:null,role:null,name:"",cid:null}; // peer = my player id (p0 host); cid = stable client id
var GS=null;
var CODE=null,DEBUG=false,DBOK=false,NEXTN=1;
var rdb=null,stateRef=null,inboxRef=null,stateSub=null,inboxSub=null,lastJoin=0;

function isHost(){return ME.role==="host"}
function amPlayer(pid){return GS&&GS.players&&GS.players.some(function(p){return p.pid===pid})}
function rid(){return Math.random().toString(36).slice(2,10)+Date.now().toString(36)}

function fbInit(){
  if(DBOK)return true;
  if(!window.firebase||typeof FBCFG==="undefined"||!FBCFG.apiKey||FBCFG.apiKey.indexOf("PASTE")>=0||!FBCFG.databaseURL||FBCFG.databaseURL.indexOf("PASTE")>=0)return false;
  try{ if(!firebase.apps.length)firebase.initializeApp(FBCFG); rdb=firebase.database(); DBOK=true; return true; }
  catch(e){ return false; }
}

if(location.search.indexOf("debug")>=0){ debugBoot(); }
else if(!fbInit()){ renderSetup(); }
else { ME.cid=rid(); render(); }

/* ---- transport (Firebase Realtime Database; host = authority) ---- */
function shortCode(){var s="ABCDEFGHJKLMNPQRSTUVWXYZ23456789",c="";for(var i=0;i<4;i++)c+=s[Math.floor(Math.random()*s.length)];return c}

function createRoom(name){
  ME.role="host";ME.name=name;ME.peer="p0";
  renderWaiting("Menyiapkan room...");
  tryClaimCode(0,name);
}
function tryClaimCode(tries,name){
  var code=shortCode();
  rdb.ref("rooms/"+code+"/state").once("value").then(function(snap){
    var v=snap.val();
    if(v&&v.createdAt&&(Date.now()-v.createdAt)<21600000&&tries<8){ tryClaimCode(tries+1,name); return; }
    CODE=code;
    GS={epoch:1,phase:"lobby",mode:lobbyMode,hostPeer:"p0",createdAt:Date.now(),
        players:[{pid:"p0",cid:ME.cid,name:name.slice(0,16),color:PCOL[0],score:0}],
        control:0,board:null,cur:null,seq:1,phaseK:1};
    stateRef=rdb.ref("rooms/"+CODE+"/state");
    inboxRef=rdb.ref("rooms/"+CODE+"/inbox");
    inboxRef.remove();
    hostListenInbox();
    broadcast();
  }).catch(function(e){ toast("Gagal konek Firebase. Cek config & rules database."); renderLanding(); });
}
function hostListenInbox(){
  inboxSub=inboxRef.on("child_added",function(ch){
    var key=ch.key,item=ch.val();
    try{ hostInbox(item); }catch(e){}
    inboxRef.child(key).remove();
  },function(e){});
}
function hostInbox(item){
  if(!item||!item.topic)return;
  if(item.topic==="join"){ hostAddPlayer(item.cid,item.name); return; }
  var p=GS.players.filter(function(x){return x.cid===item.cid})[0];
  if(p)dispatchHost(item.topic,p.pid,item.data);
}
function hostAddPlayer(cid,name){
  if(!cid)return;
  if(GS.players.some(function(p){return p.cid===cid})){ broadcast(); return; }
  if(GS.phase!=="lobby"||GS.players.length>=4)return;
  GS.players.push({pid:"p"+(NEXTN++),cid:cid,name:String(name||"Pemain").slice(0,16),color:PCOL[GS.players.length%4],score:0});
  bump();broadcast();
}
function joinRoom(code,name){
  ME.role="player";ME.name=name;CODE=String(code).toUpperCase();
  renderWaiting("Menyambung ke room "+CODE+"...");
  stateRef=rdb.ref("rooms/"+CODE+"/state");
  inboxRef=rdb.ref("rooms/"+CODE+"/inbox");
  var gotAny=false;
  stateSub=stateRef.on("value",function(snap){
    var v=snap.val();
    if(!v)return;
    gotAny=true;
    GS=normalizeGS(v);
    var mine=GS.players?GS.players.filter(function(p){return p.cid===ME.cid})[0]:null;
    ME.peer=mine?mine.pid:null;
    if(!ME.peer&&GS.phase==="lobby")sendJoin(name);
    render();
  },function(e){ toast("Koneksi database bermasalah."); });
  sendJoin(name);
  setTimeout(function(){ if(!gotAny){ toast("Room "+CODE+" nggak ketemu. Cek kode / host udah bikin belum."); renderLanding(); } },8000);
}
function sendJoin(name){
  if(!inboxRef)return;
  var now=Date.now();if(now-lastJoin<2500)return;lastJoin=now;
  inboxRef.push({cid:ME.cid,topic:"join",name:name,ts:now});
}
function broadcast(){
  render();
  if(ME.role==="host"&&stateRef){ stateRef.set(JSON.parse(JSON.stringify(GS))).catch(function(e){}); }
}
function act(topic,data){
  if(ME.role==="host"){ dispatchHost(topic,ME.peer,data); }
  else if(inboxRef){ inboxRef.push({cid:ME.cid,topic:topic,data:(data===undefined?null:data),ts:Date.now()}); }
}
function dispatchHost(topic,pid,data){
  if(!GS)return;
  if(topic==="buzz")onBuzz({peer:pid});
  else if(topic==="answer")onAnswerMsg({peer:pid,data:data});
  else if(topic==="fwager")onFWager({peer:pid,data:data});
  else if(topic==="fanswer")onFAnswer({peer:pid,data:data});
  else if(topic==="pick"){if(GS.phase==="board"&&GS.players[GS.control]&&GS.players[GS.control].pid===pid)openCell(data.c,data.r);}
}
function normalizeGS(v){
  if(!v)return v;
  if(!v.players)v.players=[];
  if(v.cur){ if(!v.cur.attempted)v.cur.attempted=[]; if(!v.cur.a)v.cur.a=[]; }
  if(v.board)v.board.forEach(function(col){ if(col&&!col.cells)col.cells=[]; });
  if(v.final){ var F=v.final; if(!F.el)F.el=[]; if(!F.wagers)F.wagers={}; if(!F.answers)F.answers={}; if(!F.ok)F.ok={}; if(!F.a)F.a=[]; }
  return v;
}

/* ============ host state writer ============ */
function push(){ broadcast(); }
function bump(){ GS.seq=(GS.seq||0)+1; }
function bumpK(){ GS.phaseK=(GS.phaseK||0)+1; }

/* ============ host timers ============ */
var hostTimer=null;
function hostAfter(sec,cb){ clearTimeout(hostTimer); hostTimer=setTimeout(cb,sec*1000); }
function hostStop(){ clearTimeout(hostTimer); hostTimer=null; }

/* ============ host: start game ============ */
function startGame(mode){
  var ps=GS.players;
  if(ps.length<2){toast("Minimal 2 pemain.");return}
  ps.forEach(function(p,i){p.color=PCOL[i%4];p.score=0});
  var cats=shuffle(CATS).slice(0,6),vals=[200,400,600,800,1000];
  var board=cats.map(function(c){var pool=shuffle(c.items);return {catId:c.id,catName:c.name,strict:c.strict,cells:vals.map(function(v,r){var q=pool.filter(function(x){return x.d===r+1})[0]||pool[r];return {v:v,used:false,dd:false,q:{id:q.id,text:q.q,a:q.a}}})}});
  var ddCol=Math.floor(Math.random()*6),ddRow=1+Math.floor(Math.random()*4);board[ddCol].cells[ddRow].dd=true;
  GS.mode=mode;GS.board=board;GS.control=Math.floor(Math.random()*ps.length);GS.phase="board";GS.cur=null;bump();push();render();
}

/* ============ host: open clue ============ */
function openCell(c,r){
  var cell=GS.board[c].cells[r];if(cell.used)return;
  var col=GS.board[c];
  GS.cur={c:c,r:r,catName:col.catName,strict:col.strict,value:cell.v,dd:cell.dd,text:cell.q.text,a:cell.q.a,
    buzzer:null,attempted:[],typed:"",lastOk:null,lastDelta:0,wager:0,reveal:false};
  if(cell.dd){ GS.phase="dd"; bump();bumpK();push();render(); }
  else{ GS.phase="buzz"; bump();bumpK();push();render(); hostAfter(10,onBuzzTimeout); }
}
function onBuzzTimeout(){ if(!isHost()||GS.phase!=="buzz")return; doReveal("Waktu buzz habis."); }
function doReveal(msg){
  GS.cur.reveal=true;GS.cur.revealMsg=msg||"";GS.phase="reveal";bump();push();render();
}

/* ============ host: buzz handling ============ */
function onBuzz(m){
  if(!isHost()||GS.phase!=="buzz")return;
  var pid=m.peer;if(!amPlayer(pid))return;
  if(GS.cur.attempted.indexOf(pid)>=0||GS.cur.buzzer)return;
  hostStop();
  GS.cur.buzzer=pid;GS.cur.attempted.push(pid);GS.phase="answer";bump();bumpK();push();render();
  hostAfter(10,function(){ if(isHost()&&GS.phase==="answer")hostJudge(""); });
}
function onAnswerMsg(m){
  if(!isHost()||GS.phase!=="answer")return;
  if(m.peer!==GS.cur.buzzer)return;
  hostStop();
  hostJudge(m.data&&typeof m.data.text==="string"?m.data.text:"");
}
function hostJudge(text){
  var ok=checkAnswer(text,GS.cur.a,GS.cur.strict);
  GS.cur.typed=text;applyVerdict(ok);
}
function applyVerdict(ok){
  var cur=GS.cur,p=playerBy(cur.buzzer);
  if(cur.lastOk!==null&&p)p.score-=cur.lastDelta;
  var d=ok?(cur.dd?cur.wager:cur.value):(cur.dd?-cur.wager:(GS.mode==="kompetitif"?-cur.value:0));
  if(p)p.score+=d;
  cur.lastDelta=d;cur.lastOk=ok;
  if(ok)GS.control=playerIdx(cur.buzzer);
  beep(ok?990:150,ok?.25:.35,ok?"sine":"sawtooth");
  GS.phase="result";bump();push();render();
}
function playerIdx(pid){for(var i=0;i<GS.players.length;i++)if(GS.players[i].pid===pid)return i;return 0}
function playerBy(pid){return GS.players[playerIdx(pid)]}
function eligibleLeft(){return GS.players.filter(function(p){return GS.cur.attempted.indexOf(p.pid)<0})}

function hostNext(){
  var cur=GS.cur;
  if(cur.lastOk||cur.dd){finishClue();return}
  if(eligibleLeft().length){
    cur.buzzer=null;cur.lastOk=null;cur.lastDelta=0;GS.phase="buzz";bump();bumpK();push();render();
    hostAfter(10,onBuzzTimeout);
  } else doReveal("Semua pemain sudah mencoba.");
}
function finishClue(){
  hostStop();GS.board[GS.cur.c].cells[GS.cur.r].used=true;GS.cur=null;
  var left=GS.board.some(function(col){return col.cells.some(function(c){return !c.used})});
  if(left){GS.phase="board";bump();push();render();}
  else startFinal();
}
function hostOverride(){ applyVerdict(!GS.cur.lastOk); }
function hostSetScore(idx){
  var p=GS.players[idx];var v=prompt("Skor baru untuk "+p.name,p.score);if(v===null)return;
  var n=Math.round(+String(v).replace(/[^0-9-]/g,""));if(isNaN(n)||String(v).trim()===""){toast("Skor harus angka");return}
  p.score=n;bump();push();render();
}

/* ============ FINAL ============ */
function startFinal(){
  hostStop();
  var el=GS.players.filter(function(p){return p.score>0}).map(function(p){return p.pid});
  var cat=CATS[Math.floor(Math.random()*CATS.length)];
  var pool=shuffle(cat.items.filter(function(x){return x.d>=4}));
  var q=pool[0]||cat.items[0];
  GS.final={catName:cat.name,strict:cat.strict,text:q.q,a:q.a,el:el,wagers:{},answers:{},ok:{},reveal:false};
  if(!el.length){GS.phase="end";bump();push();render();return}
  GS.phase="fcat";bump();bumpK();push();render();
}
function finalToWager(){ GS.phase="fwager";bump();bumpK();push();render(); }
function onFWager(m){
  if(!isHost())return;
  if(GS.phase==="dd"&&m.data&&m.data.dd){
    var ctrl=GS.players[GS.control];if(!ctrl||m.peer!==ctrl.pid)return;
    var maxd=Math.max(ctrl.score,1000),wd=Math.round((m.data&&+m.data.amt)||0);
    if(!(wd>=5&&wd<=maxd))return;
    GS.cur.wager=wd;GS.cur.buzzer=ctrl.pid;GS.cur.attempted=[ctrl.pid];GS.phase="answer";bump();bumpK();push();render();
    hostAfter(10,function(){ if(isHost()&&GS.phase==="answer")hostJudge(""); });
    return;
  }
  if(GS.phase!=="fwager")return;var F=GS.final;
  if(F.el.indexOf(m.peer)<0||(m.peer in F.wagers))return;var p=playerBy(m.peer);
  var w=Math.round((m.data&&+m.data.amt)||0);w=Math.max(0,Math.min(w,Math.max(p.score,0)));
  F.wagers[m.peer]=w;bump();push();render();
  if(Object.keys(F.wagers).length>=F.el.length){ GS.phase="fask";bumpK();bump();push();render();
    hostAfter(30,function(){ if(isHost()&&GS.phase==="fask")finalReveal(); }); }
}
function onFAnswer(m){
  if(!isHost()||GS.phase!=="fask")return;var F=GS.final;
  if(F.el.indexOf(m.peer)<0||m.peer in F.answers)return;
  F.answers[m.peer]=m.data&&typeof m.data.text==="string"?m.data.text:"";
  F.ok[m.peer]=checkAnswer(F.answers[m.peer],F.a,F.strict);
  bump();push();render();
  if(Object.keys(F.answers).length>=F.el.length){hostStop();finalReveal();}
}
function finalReveal(){ GS.final.reveal=true;GS.phase="freveal";bump();push();render(); }
function finalToggle(pid){ GS.final.ok[pid]=!GS.final.ok[pid];bump();push();render(); }
function finalApply(){
  var F=GS.final;F.el.forEach(function(pid){var p=playerBy(pid);var w=F.wagers[pid]||0;p.score+=F.ok[pid]?w:-w;});
  GS.phase="end";bump();push();render();
}
function playAgain(){
  GS.players.forEach(function(p){p.score=0});GS.final=null;GS.cur=null;
  GS.phase="lobby";GS.board=null;bump();push();render();
}

/* ============ client countdown ============ */
var cdTimer=null,cdKey=null;
function startCountdown(sec){
  var bar=$("cdbar"),wrap=$("cd");if(!bar)return;
  var end=Date.now()+sec*1000;
  clearInterval(cdTimer);
  cdTimer=setInterval(function(){
    var left=Math.max(0,end-Date.now());bar.style.width=(left/(sec*1000)*100)+"%";
    if(wrap)wrap.classList.toggle("urgent",left<3000);
    if(left<=0)clearInterval(cdTimer);
  },80);
}

function renderClue(){
  var actKey=[GS.phase,GS.cur?GS.cur.c+","+GS.cur.r:GS.final?"F":"-",GS.cur?GS.cur.buzzer:"",ME.role,GS.phaseK,GS.cur?GS.cur.lastDelta:"",GS.final?Object.keys(GS.final.answers||{}).length+"/"+Object.keys(GS.final.wagers||{}).length:""].join("|");
  var fresh=actKey!==lastActKey;
  if(fresh){
    var head=GS.cur?fmt(GS.cur.value):"Final";
    root.innerHTML=shell(GS.cur?fmt(GS.cur.value):"Final","");
    lastActKey=actKey;
  }
  var host=isHost();
  var P=GS.phase;
  if(P==="dd") return ddPlayer();
  if(P==="buzz") return buzzPlayer(fresh);
  if(P==="answer") return answerPlayer(fresh);
  if(P==="result") return host?resultHost():resultPlayer();
  if(P==="reveal") return host?revealHost():revealPlayer();
  if(P==="fcat") return host?fcatHost():fcatPlayer();
  if(P==="fwager") return fwagerPlayer(fresh);
  if(P==="fask") return faskPlayer(fresh);
  if(P==="freveal") return host?frevealHost():frevealPlayer();
}

function fcatPlayer(){
  showCd(false);$("ctx").innerHTML='<div class="dd" style="font-size:clamp(30px,6vw,64px)">'+esc(GS.final.catName)+'</div>';
  var inF=GS.final.el.indexOf(ME.peer)>=0;
  setStat(inF?"Bersiap pasang taruhan...":"Kamu tidak ikut Final (poin di bawah nol)");setAct("");
}
function fwagerHost(){
  showCd(false);var F=GS.final;$("ctx").innerHTML='<div class="dd" style="font-size:clamp(30px,6vw,64px)">'+esc(F.catName)+'</div>';
  setStat("Menunggu taruhan rahasia... ("+Object.keys(F.wagers).length+"/"+F.el.length+")");
  setAct('<p class="hint" style="color:#c7cdf7;text-align:center;margin:0">Tiap pemain pasang taruhan di HP masing-masing.</p>');
}
function fwagerPlayer(fresh){
  showCd(false);var F=GS.final;var inF=F.el.indexOf(ME.peer)>=0;
  $("ctx").innerHTML='<div class="dd" style="font-size:clamp(30px,6vw,64px)">'+esc(F.catName)+'</div>';
  if(!inF){setStat("Kamu menonton Final");setAct("");return}
  var me=playerBy(ME.peer),sent=(ME.peer in F.wagers)||mySubmittedK===GS.phaseK;
  setStat(sent?"Taruhan terkirim, menunggu pemain lain...":"Taruhan rahasia kamu, 0 sampai "+fmt(me.score));
  if(sent){setAct("");return}
  if(!$("wi")){
    setAct('<div class="ansrow" style="--pc:'+me.color+'"><input id="wi" type="password" inputmode="numeric" placeholder="Taruhan rahasia"><button class="btn" id="wb">Kunci</button></div>');
    var go=function(){var v=$("wi")?$("wi").value:"";var w=Math.round(+v);if(v===""||!(w>=0&&w<=me.score)){setStat("Taruhan 0 sampai "+fmt(me.score));return}playerFWager(w);setStat("Taruhan terkirim...");setAct("")};
    if($("wb"))$("wb").onclick=go;
    if($("wi"))$("wi").addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();go()}});
  }
}
function faskHost(){
  showCd(true);startCountdown(30);var F=GS.final;
  $("ctx").innerHTML=esc(F.text);
  setStat("Pemain menjawab... ("+Object.keys(F.answers).length+"/"+F.el.length+")");
  setAct('<div class="btnrow"><button class="btn ghost" id="rev">Buka hasil sekarang</button></div>');
  if($("rev"))$("rev").onclick=finalReveal;
}
function faskPlayer(fresh){
  var F=GS.final,inF=F.el.indexOf(ME.peer)>=0;showCd(true);if(fresh)startCountdown(30);
  $("ctx").innerHTML=esc(F.text);
  if(!inF){setStat("Kamu menonton Final");setAct("");return}
  var me=playerBy(ME.peer),sent=(ME.peer in F.answers)||mySubmittedK===GS.phaseK;
  setStat(sent?"Jawaban terkirim...":"Jawaban Final kamu, 30 detik (taruhan "+fmt(F.wagers[ME.peer]||0)+")");
  if(sent){setAct("");return}
  if(!$("ai")){
    setAct('<div class="ansrow" style="--pc:'+me.color+'"><input id="ai" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Jawaban Final..."><button class="btn" id="ab">Kunci</button></div>');
    var inp=$("ai");setTimeout(function(){if(inp)inp.focus()},30);
    var go=function(){var v=$("ai")?$("ai").value:"";playerFAnswer(v);setStat("Jawaban terkirim...");setAct("")};
    if($("ab"))$("ab").onclick=go;
    if(inp)inp.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();go()}});
  }
}
function frevealHost(){
  showCd(false);var F=GS.final;
  var h='<div style="font-size:.5em;max-width:38ch;margin:0 auto 6px">'+esc(F.text)+'<div class="answer">Jawaban: '+esc(F.a[0])+'</div></div>';
  h+=F.el.map(function(pid){var p=playerBy(pid);return '<div class="typed" style="display:flex;justify-content:space-between;gap:8px;border-top:1px solid #ffffff33;padding:8px 0"><span>'+esc(p.name)+': '+(F.answers[pid]&&F.answers[pid].trim()?esc(F.answers[pid]):"(kosong)")+' <span style="opacity:.6">('+fmt(F.wagers[pid]||0)+')</span></span><button class="btn ghost" data-p="'+pid+'">'+(F.ok[pid]?"Benar":"Salah")+'</button></div>'}).join("");
  $("ctx").innerHTML=h;setStat("");
  setAct('<div class="btnrow"><button class="btn" id="apply">Terapkan & lihat hasil</button></div>');
  Array.prototype.forEach.call(document.querySelectorAll("[data-p]"),function(b){b.onclick=function(){finalToggle(b.getAttribute("data-p"))}});
  $("apply").onclick=finalApply;
}
function frevealPlayer(){
  showCd(false);var F=GS.final;var mine=F.el.indexOf(ME.peer)>=0;
  $("ctx").innerHTML='<div class="answer" style="margin-top:0">Jawaban: '+esc(F.a[0])+'</div>'+
    (mine?'<div class="typed">Kamu: '+(F.answers[ME.peer]&&F.answers[ME.peer].trim()?esc(F.answers[ME.peer]):"(kosong)")+' — '+(F.ok[ME.peer]?"Benar":"Salah")+'</div>':'');
  setStat("");setAct('<p class="hint" style="color:#c7cdf7;text-align:center;margin:0">Menunggu Tuan Rumah...</p>');
}
function renderEnd(){
  var r=GS.players.slice().sort(function(a,b){return b.score-a.score});
  var h='<div class="wrap"><h1 class="logo">'+esc(r[0]?r[0].name:"")+' menang<small>Skor akhir</small></h1>';
  r.forEach(function(p,i){h+='<div class="rank" style="--pc:'+p.color+'"><span>'+(i+1)+'. '+esc(p.name)+(p.pid===ME.peer?" (kamu)":"")+'</span><span class="slab">'+fmt(p.score)+'</span></div>'});
  if(isHost())h+='<button class="big" id="again">Main lagi (pemain sama)</button>';
  else h+='<p class="hint" style="text-align:center;margin-top:16px">Menunggu Tuan Rumah memulai game baru...</p>';
  root.innerHTML=h+'</div>';
  if($("again"))$("again").onclick=playAgain;
  lastActKey=null;
}
var toastT=null;
function toast(t){var d=$("toastEl");if(!d){d=document.createElement("div");d.id="toastEl";d.className="toast";document.body.appendChild(d)}d.textContent=t;d.classList.remove("hidden");clearTimeout(toastT);toastT=setTimeout(function(){if(d)d.classList.add("hidden")},2600)}
function debugBoot(){
  DEBUG=true;ME={peer:"p0",role:"host",name:"Andi",cid:"c0"};
  GS={epoch:1,phase:"lobby",mode:"klasik",hostPeer:"p0",players:[
    {pid:"p0",name:"Andi",color:PCOL[0],score:0},
    {pid:"p1",name:"Bela",color:PCOL[1],score:0},
    {pid:"p2",name:"Cici",color:PCOL[2],score:0}],control:0,board:null,cur:null,seq:1,phaseK:1};
  // expose helpers so the test harness can drive remote players locally
  window.__dbg={GS:function(){return GS},start:function(m){startGame(m||"klasik")},
    dispatch:function(t,pid,d){dispatchHost(t,pid,d)},sfinal:function(){startFinal()},setMe:function(pid){ME.peer=pid;ME.role=(pid==="p0"?"host":"player");render();},render:render};
  render();
}

})();
